services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: battletechSearch
      POSTGRES_USER: battletech
      POSTGRES_PASSWORD: battletech
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battletech -d battletechSearch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
